name: Refresh ABS data

on:
  schedule:
    # Thursdays 9:13am Perth (Thursday 01:13 UTC); ABS releases land on various weekdays, so a weekly check catches each one
    - cron: "13 1 * * 4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/abs.yml"
      - "scripts/build_abs_data.py"

permissions:
  contents: write

concurrency:
  group: abs-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Australia-wide data file from the ABS Data API
        run: python3 scripts/build_abs_data.py

      - name: Publish if the ABS has released new figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/australia.json
          if git diff --cached --quiet; then echo "No new ABS figures."; exit 0; fi
          git commit -m "Update ABS Australia-wide data"
          git pull --rebase origin main
          git push
